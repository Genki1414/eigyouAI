name: Ops read-only (server status)

# 本番サーバーの「状態を見るだけ」の手動ワークフロー(T116)。
# 外出先でサーバーへログインできないときに、コンテナの稼働状況・ログ・送信キューを
# 確認するためのもの。CI & Deployと同じSSH用シークレットを使う。
#
# 設計方針:
#  - 参照のみ。再起動・設定変更・ファイル書き換えは一切行わない。
#  - 任意のコマンドは受け付けない。actionの選択肢ごとに決め打ちの参照コマンドだけを流す。
#  - .envの値は表示しない(名前すら出さない)。設定値の確認は本部画面の
#    「システム診断」(GET /api/ops/diagnostics)を使うこと。
#  - 実行にはリポジトリへの書き込み権限が必要で、全実行がActionsの履歴に残る。
on:
  workflow_dispatch:
    inputs:
      since:
        description: "集計の開始時刻(任意。例 2026-09-23T15:05:00)。send-*-since で使う"
        required: false
        type: string
      action:
        description: "確認したい内容"
        required: true
        type: choice
        options:
          - status         # コンテナの稼働状況・メモリ・ディスク・メモリ不足の記録
          - logs-sender    # 送信ワーカーのログ(直近150行)
          - logs-api       # APIのログ(直近150行)
          - queue          # 送信キュー(順番待ち・送信中)の一覧
          - send-delivery  # 送信ログ: どこまで進めたかを会社数で(他社との比較用)
          - send-delivery-today  # 同上を「今日ぶん」だけで(実行中の成績を見る)
          - send-delivery-since  # 同上を since 以降で(改修の効果を測る)
          - send-reasons-since   # 理由別の件数を since 以降で
          - send-before-after    # since を境に、同じ会社の結果がどう変わったか
          - send-urls-unconfirmed # since 以降で「完了を確認できない」になったURL
          - send-unconfirmed-hints # since 以降の「完了を確認できない」の手がかり内訳(reCAPTCHA v3等)
          - dup-check      # 既に成功済みの会社へ再送していないか(件数のみ)
          - proxy-check    # プロキシが今使えるか(認証情報は出さない)
          - send-reasons-today   # 結果・理由別の件数と成功率を「今日ぶん」だけで
          - send-reasons   # 送信ログ: 結果・理由別の件数と成功率(直近30日)
          - send-runs      # 送信ログ: 実行(リスト)単位の成績(直近30日)
          - send-urls-weak # 送信ログ: 「URLが変わっただけ」で成功にした分のURLと押した要素
          - send-urls-noform   # 送信ログ: 問い合わせフォームが見つからなかったURL
          - send-urls-nosubmit # 送信ログ: 送信ボタンが見つからなかったURL
          - send-error-hints   # 送信ログ: 検知したエラー文言の内訳(誤検出の確認)+弾かれた欄と文言
          - sender-fields      # 送信元テンプレートのどの欄が空か(値は出さない。弾かれる原因の切り分け)
          - send-urls-error    # 送信ログ: 送信後にエラー表示が出たURL(必須欄の取りこぼし調査)
          - send-urls-nofield  # 送信ログ: 入力できる欄が見つからなかったURL

jobs:
  look:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      ACTION: ${{ inputs.action }}
      SINCE: ${{ inputs.since }}
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Show server status
        run: |
          set -e
          case "$ACTION" in
            status)
              REMOTE="cd '$DEPLOY_PATH'
                echo '=== コンテナ ==='; docker compose -f deploy/docker-compose.yml ps
                echo; echo '=== メモリ(MB) ==='; free -m
                echo; echo '=== ディスク ==='; df -h /
                echo; echo '=== 稼働時間 ==='; uptime
                echo; echo '=== 直近のメモリ不足(OOM) ==='
                dmesg 2>/dev/null | grep -i 'killed process' | tail -5 || echo 'なし'" ;;
            logs-sender)
              REMOTE="docker logs --tail 150 eigyouai-sender 2>&1 | tail -150" ;;
            logs-api)
              REMOTE="docker logs --tail 150 eigyouai-api 2>&1 | tail -150" ;;
            queue)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 scheduled_send_cli.py list" ;;
            # 送信ログ(form_send_log)の集計。send_log_report_cli.py は参照専用で、
            # 会社名・送信本文・メールアドレスは出さない(理由別の件数と、検証用の
            # 問い合わせ先URLだけ)。URLは公開されている企業サイトのもの。
            # --days 1 は「今日ぶん」の意味で使う(_since()が現在時刻からの相対で
            # 絞るため、厳密には直近24時間。1回の送信の成績を見るのに使う)
            # 二重送信の実数を件数だけで確認する(会社名・本文は出さない)。
            # form_send_logは追記のみなので、実行開始時刻を境にすれば過去の状態を
            # そのまま再現できる(touches.sent_atは再送信で上書きされるため使えない)。
            # プロキシが「今」使える状態かを本番から確かめる(2026-09-23)。
            # 2026-09-22の事故では確かめる手段が無く、8時間気づけないまま
            # 約480社をERR_TUNNEL_CONNECTION_FAILEDで失った。
            # 出力はhost:portと成否のみ(認証情報は出さない)。DBには触れない。
            proxy-check)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 proxy_check_cli.py --concurrency 3" ;;
            dup-check)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 -c 'import db; c=db.connect(); t=\"2026-09-22T14:38:00\"; S=\"SUCCESS\"; n=lambda q,a: c.execute(q,a).fetchone()[0]; a=n(\"SELECT COUNT(DISTINCT company_id) FROM form_send_log WHERE started_at<? AND status=?\",(t,S)); b=n(\"SELECT COUNT(DISTINCT company_id) FROM form_send_log WHERE started_at>=?\",(t,)); cc=n(\"SELECT COUNT(*) FROM (SELECT company_id FROM form_send_log GROUP BY company_id HAVING SUM(CASE WHEN started_at>=? THEN 1 ELSE 0 END)>0 AND SUM(CASE WHEN started_at<? AND status=? THEN 1 ELSE 0 END)>0) x\",(t,t,S)); d=n(\"SELECT COUNT(*) FROM (SELECT company_id FROM form_send_log GROUP BY company_id HAVING SUM(CASE WHEN started_at>=? AND status=? THEN 1 ELSE 0 END)>0 AND SUM(CASE WHEN started_at<? AND status=? THEN 1 ELSE 0 END)>0) x\",(t,S,t,S)); print(\"境界 %s より前=過去 / 以降=今回の実行\" % t); print(\"  境界より前に成功していた会社数           %6d\" % a); print(\"  境界以降に送信を試した会社数             %6d\" % b); print(\"  うち既に成功済みだった会社数(=二重送信)  %6d\" % cc); print(\"    うち今回も成功した会社数               %6d\" % d)'" ;;
            # --since で開始時刻を固定して集計する(2026-09-23)。
            # --days は現在時刻からのスライド窓なので、時間をおいて2回実行すると
            # 母集団が変わり、改修の前後を比べても意味のない数字になる(実際にやった:
            # 2時間後に測り直したら前半が窓から外れて件数が減っただけだった)。
            # 「完了を確認できない」は押した後にURLも変わらずフォームも残る状態で、
            # error_message も page_text_snippet も記録されない(後者は本番では
            # keep_debug_fields=False のため常にNULL)。DBに残る手がかりは
            # 問い合わせ先URLだけなので、それを取り出して実ページを見に行く。
            send-urls-unconfirmed)
              case "$SINCE" in
                "") echo "::error::since を指定してください"; exit 1 ;;
                *[!0-9T:-]*) echo "::error::sinceは日時のみ(例 2026-09-23T15:05:00)"; exit 1 ;;
              esac
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T \
                  -e SINCE_AT='$SINCE' sender \
                  python3 -c 'import os,argparse,db,send_log_report_cli as R; from datetime import datetime; s=os.environ[\"SINCE_AT\"]; d=round((datetime.now()-datetime.fromisoformat(s)).total_seconds()/86400,6); k=dict(days=d,reason=\"success_not_confirmed\",status=None,limit=60); ns=argparse.Namespace(since=s,**k) if hasattr(R,\"_window\") else argparse.Namespace(**k); print(\"集計開始: \"+s); R.cmd_urls(db.connect(),ns)'" ;;
            # 「完了を確認できない」の手がかり(T126以降、error_message に残る)の内訳。
            # reCAPTCHA v3 の有無・押した要素・入力値が残ったか、を件数で見る
            send-unconfirmed-hints)
              case "$SINCE" in
                "") echo "::error::since を指定してください"; exit 1 ;;
                *[!0-9T:-]*) echo "::error::sinceは日時のみ(例 2026-09-23T15:05:00)"; exit 1 ;;
              esac
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T \
                  -e SINCE_AT='$SINCE' sender \
                  python3 -c 'import os,argparse,db,send_log_report_cli as R; from datetime import datetime; s=os.environ[\"SINCE_AT\"]; d=round((datetime.now()-datetime.fromisoformat(s)).total_seconds()/86400,6); k=dict(days=d,reason=\"success_not_confirmed\",limit=40); ns=argparse.Namespace(since=s,**k) if hasattr(R,\"_window\") else argparse.Namespace(**k); print(\"集計開始: \"+s); R.cmd_error_hints(db.connect(),ns)'" ;;
            # 改修の効果は「全体の成功率」では測れない。送信し直す対象は
            # 前回うまくいかなかった会社に偏っているので、母集団が違う
            # 数字を並べても比べたことにならない。**同じ会社**が境界の
            # 前後でどう変わったかを見る(完了未確認→成功 が救えた分)。
            send-before-after)
              case "$SINCE" in
                "") echo "::error::since を指定してください"; exit 1 ;;
                *[!0-9T:-]*) echo "::error::sinceは日時のみ(例 2026-09-23T15:05:00)"; exit 1 ;;
              esac
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T \
                  -e SINCE_AT='$SINCE' sender \
                  python3 -c 'import os,db; b=os.environ[\"SINCE_AT\"]; S=\"SUCCESS\"; U=\"success_not_confirmed\"; L={0:\"送信なし\",1:\"その他(失敗)\",2:\"完了を確認できない\",3:\"成功\"}; rows=db.connect().execute(\"WITH a AS (SELECT company_id, MAX(CASE WHEN started_at<? THEN (CASE WHEN status=? THEN 3 WHEN reason_code=? THEN 2 ELSE 1 END) ELSE 0 END) bef, MAX(CASE WHEN started_at>=? THEN (CASE WHEN status=? THEN 3 WHEN reason_code=? THEN 2 ELSE 1 END) ELSE 0 END) aft FROM form_send_log GROUP BY company_id) SELECT bef,aft,COUNT(*) n FROM a WHERE aft>0 GROUP BY bef,aft ORDER BY bef,aft\",(b,S,U,b,S,U)).fetchall(); print(\"境界 \"+b+\" の前後で、同じ会社の結果がどう変わったか\"); print(\"  ※境界より後に1回でも送信した会社だけを数えています\"); print(\"  %-22s %-22s %7s\" % (\"境界より前\",\"境界より後\",\"会社数\")); [print(\"  %-22s %-22s %7d\" % (L[r[0]],L[r[1]],r[2])) for r in rows]'" ;;
            send-delivery-since)
              case "$SINCE" in
                "") echo "::error::since を指定してください"; exit 1 ;;
                *[!0-9T:-]*) echo "::error::sinceは日時のみ(例 2026-09-23T15:05:00)"; exit 1 ;;
              esac
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T \
                  -e SINCE_AT='$SINCE' sender \
                  python3 -c 'import os,argparse,db,send_log_report_cli as R; from datetime import datetime; s=os.environ[\"SINCE_AT\"]; d=round((datetime.now()-datetime.fromisoformat(s)).total_seconds()/86400,6); ns=argparse.Namespace(days=d,since=s) if hasattr(R,\"_window\") else argparse.Namespace(days=d); print(\"集計開始: \"+s); R.cmd_delivery(db.connect(),ns)'" ;;
            send-reasons-since)
              case "$SINCE" in
                "") echo "::error::since を指定してください"; exit 1 ;;
                *[!0-9T:-]*) echo "::error::sinceは日時のみ(例 2026-09-23T15:05:00)"; exit 1 ;;
              esac
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T \
                  -e SINCE_AT='$SINCE' sender \
                  python3 -c 'import os,argparse,db,send_log_report_cli as R; from datetime import datetime; s=os.environ[\"SINCE_AT\"]; d=round((datetime.now()-datetime.fromisoformat(s)).total_seconds()/86400,6); ns=argparse.Namespace(days=d,since=s) if hasattr(R,\"_window\") else argparse.Namespace(days=d); print(\"集計開始: \"+s); R.cmd_reasons(db.connect(),ns)'" ;;
            send-delivery-today)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py delivery --days 1" ;;
            send-reasons-today)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py reasons --days 1" ;;
            send-delivery)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py delivery --days 30" ;;
            send-reasons)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py reasons --days 30" ;;
            send-runs)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py runs --days 30" ;;
            send-urls-weak)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py urls \
                    --reason url_changed_after_submit --days 30 --limit 40" ;;
            send-urls-noform)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py urls \
                    --reason form_not_found --days 30 --limit 40" ;;
            send-urls-nosubmit)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py urls \
                    --reason submit_button_not_found --days 30 --limit 40" ;;
            send-error-hints)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py error-hints --days 30 --limit 30" ;;
            sender-fields)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py sender-fields" ;;
            send-urls-error)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py urls \
                    --reason error_message_detected --days 30 --limit 40" ;;
            send-urls-nofield)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py urls \
                    --reason no_fields_filled --days 30 --limit 40" ;;
            *)
              echo "::error::未知のaction: $ACTION"; exit 1 ;;
          esac
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE"

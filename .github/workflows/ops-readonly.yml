name: Ops read-only (server status)

# 本番サーバーの「状態を見るだけ」の手動ワークフロー(T116)。
# 外出先でサーバーへログインできないときに、コンテナの稼働状況・ログ・送信キューを
# 確認するためのもの。CI & Deployと同じSSH用シークレットを使う。
#
# 設計方針:
#  - 参照のみ。再起動・設定変更・ファイル書き換えは一切行わない。
#  - 任意のコマンドは受け付けない。actionの選択肢ごとに決め打ちの参照コマンドだけを流す。
#  - .envの値は表示しない(名前すら出さない)。設定値の確認は本部画面の
#    「システム診断」(GET /api/ops/diagnostics)を使うこと。
#  - 実行にはリポジトリへの書き込み権限が必要で、全実行がActionsの履歴に残る。
on:
  workflow_dispatch:
    inputs:
      action:
        description: "確認したい内容"
        required: true
        type: choice
        options:
          - status         # コンテナの稼働状況・メモリ・ディスク・メモリ不足の記録
          - logs-sender    # 送信ワーカーのログ(直近150行)
          - logs-api       # APIのログ(直近150行)
          - queue          # 送信キュー(順番待ち・送信中)の一覧
          - send-delivery  # 送信ログ: どこまで進めたかを会社数で(他社との比較用)
          - send-delivery-today  # 同上を「今日ぶん」だけで(実行中の成績を見る)
          - dup-check      # 既に成功済みの会社へ再送していないか(件数のみ)
          - send-reasons-today   # 結果・理由別の件数と成功率を「今日ぶん」だけで
          - send-reasons   # 送信ログ: 結果・理由別の件数と成功率(直近30日)
          - send-runs      # 送信ログ: 実行(リスト)単位の成績(直近30日)
          - send-urls-weak # 送信ログ: 「URLが変わっただけ」で成功にした分のURLと押した要素
          - send-urls-noform   # 送信ログ: 問い合わせフォームが見つからなかったURL
          - send-urls-nosubmit # 送信ログ: 送信ボタンが見つからなかったURL
          - send-error-hints   # 送信ログ: 検知したエラー文言の内訳(誤検出の確認)
          - send-urls-error    # 送信ログ: 送信後にエラー表示が出たURL(必須欄の取りこぼし調査)
          - send-urls-nofield  # 送信ログ: 入力できる欄が見つからなかったURL

jobs:
  look:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      ACTION: ${{ inputs.action }}
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Show server status
        run: |
          set -e
          case "$ACTION" in
            status)
              REMOTE="cd '$DEPLOY_PATH'
                echo '=== コンテナ ==='; docker compose -f deploy/docker-compose.yml ps
                echo; echo '=== メモリ(MB) ==='; free -m
                echo; echo '=== ディスク ==='; df -h /
                echo; echo '=== 稼働時間 ==='; uptime
                echo; echo '=== 直近のメモリ不足(OOM) ==='
                dmesg 2>/dev/null | grep -i 'killed process' | tail -5 || echo 'なし'" ;;
            logs-sender)
              REMOTE="docker logs --tail 150 eigyouai-sender 2>&1 | tail -150" ;;
            logs-api)
              REMOTE="docker logs --tail 150 eigyouai-api 2>&1 | tail -150" ;;
            queue)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 scheduled_send_cli.py list" ;;
            # 送信ログ(form_send_log)の集計。send_log_report_cli.py は参照専用で、
            # 会社名・送信本文・メールアドレスは出さない(理由別の件数と、検証用の
            # 問い合わせ先URLだけ)。URLは公開されている企業サイトのもの。
            # --days 1 は「今日ぶん」の意味で使う(_since()が現在時刻からの相対で
            # 絞るため、厳密には直近24時間。1回の送信の成績を見るのに使う)
            # 二重送信の実数を件数だけで確認する(会社名・本文は出さない)。
            # form_send_logは追記のみなので、実行開始時刻を境にすれば過去の状態を
            # そのまま再現できる(touches.sent_atは再送信で上書きされるため使えない)。
            dup-check)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 -c 'import db; c=db.connect(); t=\"2026-09-22T14:38:00\"; S=\"SUCCESS\"; n=lambda q,a: c.execute(q,a).fetchone()[0]; a=n(\"SELECT COUNT(DISTINCT company_id) FROM form_send_log WHERE started_at<? AND status=?\",(t,S)); b=n(\"SELECT COUNT(DISTINCT company_id) FROM form_send_log WHERE started_at>=?\",(t,)); cc=n(\"SELECT COUNT(*) FROM (SELECT company_id FROM form_send_log GROUP BY company_id HAVING SUM(CASE WHEN started_at>=? THEN 1 ELSE 0 END)>0 AND SUM(CASE WHEN started_at<? AND status=? THEN 1 ELSE 0 END)>0) x\",(t,t,S)); d=n(\"SELECT COUNT(*) FROM (SELECT company_id FROM form_send_log GROUP BY company_id HAVING SUM(CASE WHEN started_at>=? AND status=? THEN 1 ELSE 0 END)>0 AND SUM(CASE WHEN started_at<? AND status=? THEN 1 ELSE 0 END)>0) x\",(t,S,t,S)); print(\"境界 %s より前=過去 / 以降=今回の実行\" % t); print(\"  境界より前に成功していた会社数           %6d\" % a); print(\"  境界以降に送信を試した会社数             %6d\" % b); print(\"  うち既に成功済みだった会社数(=二重送信)  %6d\" % cc); print(\"    うち今回も成功した会社数               %6d\" % d)'" ;;
            send-delivery-today)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py delivery --days 1" ;;
            send-reasons-today)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py reasons --days 1" ;;
            send-delivery)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py delivery --days 30" ;;
            send-reasons)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py reasons --days 30" ;;
            send-runs)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py runs --days 30" ;;
            send-urls-weak)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py urls \
                    --reason url_changed_after_submit --days 30 --limit 40" ;;
            send-urls-noform)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py urls \
                    --reason form_not_found --days 30 --limit 40" ;;
            send-urls-nosubmit)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py urls \
                    --reason submit_button_not_found --days 30 --limit 40" ;;
            send-error-hints)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py error-hints --days 30 --limit 30" ;;
            send-urls-error)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py urls \
                    --reason error_message_detected --days 30 --limit 40" ;;
            send-urls-nofield)
              REMOTE="cd '$DEPLOY_PATH'
                docker compose -f deploy/docker-compose.yml exec -T sender \
                  python3 send_log_report_cli.py urls \
                    --reason no_fields_filled --days 30 --limit 40" ;;
            *)
              echo "::error::未知のaction: $ACTION"; exit 1 ;;
          esac
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE"

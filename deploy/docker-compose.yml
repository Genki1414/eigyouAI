services:
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    container_name: eigyouai-api
    env_file: [../.env]
    # 2026-08-21のHTTPS化により127.0.0.1限定へ戻した。外部からはcaddy(80/443)
    # 経由でのみ到達する。8787をインターネットへ直接公開する構成には戻さないこと
    # (HANDOFF.md T12参照)。Stock Factory Runtime（同一ホスト上の別コンテナ）
    # からは引き続き http://eigyouai-api:8787 で到達できる(コンテナ間通信は
    # ポート公開の設定に関係なく機能する)。
    ports: ["127.0.0.1:8787:8787"]
    volumes: ["engine-data:/app/out"]
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    networks: [default, stockfactory-shared]

  # HTTPS終端。EIGYOUAI_DOMAINへのアクセスをapiコンテナへ転送する。
  # 証明書はLet's Encryptから自動取得(Caddy標準機能)。
  caddy:
    image: caddy:2-alpine
    container_name: eigyouai-caddy
    env_file: [../.env]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on: [api]
    networks: [default]

  # バッチ（cronで定期実行）
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: [../.env]
    volumes: ["engine-data:/app/out", "../data:/app/data:ro"]
    command: ["/bin/bash", "-c", "crontab /app/deploy/crontab && cron -f"]
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ashibase
      POSTGRES_USER: ashibase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORDを.envに設定してください}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashibase"]
      interval: 10s
      retries: 5
    restart: unless-stopped

volumes: { engine-data: {}, pgdata: {}, caddy-data: {}, caddy-config: {} }

networks:
  default: {}
  # stockfactory-officeのdeploy側（scripts/deploy.sh）が同名で事前作成する外部ネットワーク。
  # ここでは作成せず参加するだけ（external: true）——どちらのスクリプトを先に実行しても
  # 動くように、両スクリプトが「無ければ作る」を冪等に行う。
  stockfactory-shared:
    external: true

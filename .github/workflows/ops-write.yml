# ─────────────────────────────────────────────────────────────
# これは「まだ動いていない」ワークフローの下書きです。
# GitHubはリポジトリの一番上の .github/workflows/ しか読まないため、
# この位置(一番上)に置いてあります。
#
# 有効にする手順(スマホのGitHubブラウザでできます):
#   1. このファイルを開く
#   2. 右上の「…」→ Edit file... → In place
#   3. 画面上部のファイル名 ops-write.yml.txt をタップして全部消す
#   4. 次を入力する:  .github/workflows/ops-write.yml
#   5. Commit changes(ブランチは claude/project-handoff-0ubqc1 のまま)
#
#   ※ このファイルは一番上にあるので、フォルダをさかのぼる操作は要りません。
#     名前を消して打ち直すだけです。
#
# ★ exec(任意コマンド)を使う場合は、先にGitHubで承認ゲートを作ってください:
#     リポジトリ → Settings → Environments → New environment → 名前は server-exec
#     → Required reviewers に自分を追加 → Save
#   設定していない場合、execは実行前に失敗します(無防備な遠隔実行を作らないため)。
# ─────────────────────────────────────────────────────────────
name: Ops write (server changes)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "実行する操作"
        required: true
        type: choice
        options:
          - restart-sender   # 送信ワーカーの再起動
          - send-stop        # 予約(scheduled_id)を停止する。送信中でも可、あとで再開できる
          - send-cancel      # 予約(scheduled_id)を取り消す。送信中でも可
          - send-resume      # 停止した予約(scheduled_id)を順番待ちへ戻す
          - restart-all      # 全サービスの再起動
          - show-env         # 設定の表示(鍵・パスワードの値は伏せる)
          - set-env          # 許可した設定値の変更(変更後に再起動)
          - exec             # 任意コマンド(server-exec環境の承認が必要)
          - send-clone       # 過去の予約(scheduled_id)を複製して本番送信を始める(承認が必要)
          - send-holds-backfill  # 過去の送信結果からリスト(list_id)の送信保留を作る(送信はしない。T136)
          - send-holds-retry     # リスト(list_id)の保留中の会社だけに送り直す予約を作る(承認が必要。T136)
      key:
        description: "set-envのときの設定名(例: FORM_SEND_CONCURRENCY)"
        required: false
        type: string
      value:
        description: "set-envのときの値(空にすると既定値へ戻す)"
        required: false
        type: string
      scheduled_id:
        description: "send-stop / send-cancel / send-resume / send-clone のときの予約番号(queueで見える #番号)"
        required: false
        type: string
      list_id:
        description: "send-holds-backfill / send-holds-retry のときのリスト番号(ops-readonly の send-targets で見える list)"
        required: false
        type: string
      cancel_recent_days:
        description: "send-clone のときの「過去送信対象キャンセル」の日数(既定30。0で無効=全社に送る)"
        required: false
        type: string
        default: "30"
      command:
        description: "execのときに実行するコマンド。承認するまで実行されません"
        required: false
        type: string
      reason:
        description: "execのときの理由(履歴に残ります)"
        required: false
        type: string

jobs:
  # ── 決め打ちの操作(承認なしで実行。任意コマンドは含まない) ──
  change:
    if: inputs.action != 'exec' && inputs.action != 'send-clone' && inputs.action != 'send-holds-retry'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      ACTION: ${{ inputs.action }}
      ENV_KEY: ${{ inputs.key }}
      ENV_VALUE: ${{ inputs.value }}
      SCHEDULED_ID: ${{ inputs.scheduled_id }}
      LIST_ID: ${{ inputs.list_id }}
    steps:
      - name: Validate inputs
        run: |
          set -e
          # .envで変更してよい運用設定だけを列挙する。APIキー・DB接続情報は含めない
          # (workflow_dispatchの入力値は実行履歴に残るため、秘密情報をここへ通さない)
          ALLOWED="TRACK_BASE_URL API_PUBLIC_URL FORM_SEND_CONCURRENCY SENDER_WORKERS \
            SENDER_POLL_INTERVAL SENDER_MAX_ATTEMPTS SENDER_STALL_MINUTES FORM_SETTLE_TIMEOUT_MS \
            FORM_NAV_TIMEOUT_MS FORM_ACTION_TIMEOUT_MS FORM_POST_SUBMIT_WAIT_MS FORM_OUTCOME_WAIT_MS FORM_BROWSER_REUSE \
            FORM_BROWSER_MAX_USES FORM_MAX_PER_RUN FORM_MAX_PER_HOUR FORM_MAX_PER_DAY \
            FORM_MAX_PER_TENANT_PER_HOUR MAX_LIST_SIZE MAX_CSV_ROWS OPS_ALERT_EMAIL \
            FORM_PROXY_DISABLED"
          [ "$ACTION" = "set-env" ] || exit 0
          [ -n "$ENV_KEY" ] || { echo "::error::set-envにはkeyが必要です"; exit 1; }
          case " $ALLOWED " in
            *" $ENV_KEY "*) ;;
            *) echo "::error::$ENV_KEY は変更を許可していません"; exit 1 ;;
          esac
          if [ "$(printf '%s' "$ENV_VALUE" | wc -l)" -ne 0 ]; then
            echo "::error::値に改行は使えません"; exit 1
          fi
          if printf '%s' "$ENV_VALUE" | LC_ALL=C grep -q '[^A-Za-z0-9_.:/@+-]'; then
            echo "::error::値に使えない文字があります(英数字と _ . : / @ + - のみ)"; exit 1
          fi

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apply change over SSH
        run: |
          set -e
          C="docker compose -f deploy/docker-compose.yml"
          case "$ACTION" in
            restart-sender)
              REMOTE="cd '$DEPLOY_PATH'; $C up -d sender; sleep 3; $C ps" ;;
            # 予約の停止・取り消し・再開(T127)。実行中の予約はワーカーが会社ごとの
            # 区切りで抜ける。SSHで止めてDBを書き換える(9/23にやった)代わりの正規の手段
            send-stop|send-cancel|send-resume)
              case "$SCHEDULED_ID" in
                "") echo "::error::scheduled_id を指定してください"; exit 1 ;;
                *[!0-9]*) echo "::error::scheduled_id は数字だけ"; exit 1 ;;
              esac
              SUB="${ACTION#send-}"
              REMOTE="cd '$DEPLOY_PATH'
                $C exec -T sender python3 scheduled_send_cli.py $SUB $SCHEDULED_ID" ;;
            # 送信保留の作成(T136)。過去30日の送信結果から、構造的に送れなかった会社を
            # 保留にする(送信はしない。保留は次の送信から除外され、月1回だけ再試行される)
            send-holds-backfill)
              case "$LIST_ID" in
                "") echo "::error::list_id を指定してください"; exit 1 ;;
                *[!0-9]*) echo "::error::list_id は数字だけ"; exit 1 ;;
              esac
              REMOTE="cd '$DEPLOY_PATH'
                $C exec -T sender python3 send_holds_cli.py backfill --list $LIST_ID --days 30" ;;
            restart-all)
              REMOTE="cd '$DEPLOY_PATH'; $C up -d; sleep 3; $C ps" ;;
            show-env)
              REMOTE="cd '$DEPLOY_PATH'
                awk -F= '/^[A-Z_]+=/ {
                  if (\$1 ~ /KEY|TOKEN|SECRET|PASSWORD|DATABASE_URL/) print \$1 \"=(伏せています)\"
                  else print \$0
                }' .env" ;;
            set-env)
              REMOTE="cd '$DEPLOY_PATH'
                cp .env .env.bak.\$(date +%Y%m%d%H%M%S)
                if grep -q '^$ENV_KEY=' .env; then
                  sed -i 's|^$ENV_KEY=.*|$ENV_KEY=$ENV_VALUE|' .env
                else
                  printf '%s\n' '$ENV_KEY=$ENV_VALUE' >> .env
                fi
                echo '変更後:'; grep '^$ENV_KEY=' .env
                $C up -d; sleep 3; $C ps" ;;
            *) echo "::error::未知のaction: $ACTION"; exit 1 ;;
          esac
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE"

  # ── 任意コマンド(あなたが承認したときだけ実行される) ──
  exec:
    if: inputs.action == 'exec'
    runs-on: ubuntu-latest
    environment: server-exec        # ← ここで承認待ちになる
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      COMMAND: ${{ inputs.command }}
      REASON: ${{ inputs.reason }}
    steps:
      - name: Verify approval gate is configured
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # server-exec環境に必須レビュアーが設定されていなければ、ここで止める。
          # 設定漏れのまま「承認なしで何でも実行できる経路」になるのを防ぐため
          RULES=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/environments/server-exec" \
            | python3 -c "import sys,json; print(','.join(r.get('type','') for r in json.load(sys.stdin).get('protection_rules',[])))") \
            || { echo "::error::server-exec 環境を確認できませんでした"; exit 1; }
          case "$RULES" in
            *required_reviewers*) echo "承認ゲートを確認しました: $RULES" ;;
            *) echo "::error::server-exec に必須レビュアーがありません。設定するまで実行しません"; exit 1 ;;
          esac

      - name: Show what will run
        run: |
          echo "理由: $REASON"
          echo "コマンド: $COMMAND"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run approved command over SSH
        run: |
          [ -n "$COMMAND" ] || { echo "::error::commandが空です"; exit 1; }
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$COMMAND"

  # ── 送り直しの開始(T131。過去の予約を複製して本番送信を始める。承認が必要) ──
  # パソコンから離れていて本部画面を開けないときのため。任意の文面は受け付けず、
  # 過去に画面から入れた予約(件名・本文・送信元・設定)の複製だけ。
  # 「過去送信対象キャンセル」の日数は上書きできる(既定30。届いた可能性のある会社を除外)。
  # 何社に送るかは事前に ops-readonly の send-targets で確かめること。
  send:
    if: inputs.action == 'send-clone' || inputs.action == 'send-holds-retry'
    runs-on: ubuntu-latest
    environment: server-exec        # ← exec と同じ承認ゲート(本番送信が始まるため)
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      ACTION: ${{ inputs.action }}
      SCHEDULED_ID: ${{ inputs.scheduled_id }}
      CANCEL_DAYS: ${{ inputs.cancel_recent_days }}
      LIST_ID: ${{ inputs.list_id }}
    steps:
      - name: Verify approval gate is configured
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RULES=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/environments/server-exec" \
            | python3 -c "import sys,json; print(','.join(r.get('type','') for r in json.load(sys.stdin).get('protection_rules',[])))") \
            || { echo "::error::server-exec 環境を確認できませんでした"; exit 1; }
          case "$RULES" in
            *required_reviewers*) echo "承認ゲートを確認しました: $RULES" ;;
            *) echo "::error::server-exec に必須レビュアーがありません。設定するまで実行しません"; exit 1 ;;
          esac

      - name: Validate inputs
        run: |
          if [ "$ACTION" = "send-holds-retry" ]; then
            case "$LIST_ID" in
              "") echo "::error::list_id を指定してください"; exit 1 ;;
              *[!0-9]*) echo "::error::list_id は数字だけ"; exit 1 ;;
            esac
            echo "送信保留の再試行: リスト $LIST_ID(保留中の会社だけに、直近の本番予約と同じ文面で送る)"
            exit 0
          fi
          case "$SCHEDULED_ID" in
            "") echo "::error::scheduled_id(複製元の予約番号)を指定してください"; exit 1 ;;
            *[!0-9]*) echo "::error::scheduled_id は数字だけ"; exit 1 ;;
          esac
          case "$CANCEL_DAYS" in
            "") echo "::error::cancel_recent_days を指定してください(既定30)"; exit 1 ;;
            *[!0-9]*) echo "::error::cancel_recent_days は数字だけ"; exit 1 ;;
          esac
          echo "複製元の予約: #$SCHEDULED_ID / 過去送信対象キャンセル: ${CANCEL_DAYS}日"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Start the resend over SSH
        run: |
          if [ "$ACTION" = "send-holds-retry" ]; then
            # 保留中の会社だけに送る予約を作る(T136)。--older-than-days 0 = 期限を待たず今すぐ
            REMOTE="cd '$DEPLOY_PATH'
              docker compose -f deploy/docker-compose.yml exec -T sender \
                python3 send_holds_cli.py retry --list $LIST_ID --older-than-days 0"
          else
            REMOTE="cd '$DEPLOY_PATH'
              docker compose -f deploy/docker-compose.yml exec -T sender \
                python3 scheduled_send_cli.py clone $SCHEDULED_ID --cancel-recent-days $CANCEL_DAYS"
          fi
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE"

services:
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    container_name: eigyouai-api
    env_file: [../.env]
    # 2026-08-21のHTTPS化により127.0.0.1限定へ戻した。外部からはcaddy(80/443)
    # 経由でのみ到達する。8787をインターネットへ直接公開する構成には戻さないこと
    # (HANDOFF.md T12参照)。Stock Factory Runtime（同一ホスト上の別コンテナ）
    # からは引き続き http://eigyouai-api:8787 で到達できる(コンテナ間通信は
    # ポート公開の設定に関係なく機能する)。
    ports: ["127.0.0.1:8787:8787"]
    volumes: ["engine-data:/app/out"]
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    networks: [default, stockfactory-shared]

  # HTTPS終端(未使用)。当初はCaddyでLet's Encrypt証明書を自動取得する想定
  # だったが、本番はサーバー既存のnginx(他のStock Factory系サービスと共有)が
  # 80/443番を使ってTLS終端している(HANDOFF.md T12以降参照)。このcaddyサービスを
  # profiles無しで定義したままだと`docker compose up -d`のたびに毎回ポート80番の
  # 奪い合いで起動失敗する(2026-08-25に実際に発生)。profilesで明示的に
  # 除外し、`docker compose up -d`だけでは決して起動しないようにする
  # (万一Caddy運用に戻す場合のみ `docker compose --profile caddy up -d`)。
  caddy:
    image: caddy:2-alpine
    container_name: eigyouai-caddy
    profiles: ["caddy"]
    env_file: [../.env]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on: [api]
    networks: [default]

  # 送信ワーカー(T91)。list_builder.htmlの「送信する」「予約送信」はどちらも
  # scheduled_sendsキューに入り、このサービスが常駐で拾って実行する(apiは受付だけ)。
  # 並列数は.envのSENDER_WORKERS(プロセス数)×FORM_SEND_CONCURRENCY(1プロセスの並列数)。
  # サーバー増強後は.envの値を上げて `docker compose up -d sender` で反映。
  # さらに別サーバーで動かす場合はDATABASE_URL(Postgres)を共有すれば台数を増やせる
  # (予約の取り込みはDBのUPDATEでアトミックに行うため二重実行しない)。
  sender:
    build: { context: .., dockerfile: deploy/Dockerfile }
    container_name: eigyouai-sender
    env_file: [../.env]
    volumes: ["engine-data:/app/out"]
    command: ["python3", "scheduled_send_cli.py", "loop"]
    stop_grace_period: 60s
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    networks: [default]

  # バッチ（cronで定期実行）
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: [../.env]
    # ../backup_ssh: backup.py sync_offsite()(T37)がバックアップ先(Hetzner
    # Storage Box等)へrsync -e sshする際に使う秘密鍵(id_ed25519という名前で
    # 置くとsshが自動で見つける)。known_hosts をここへ書き込めるよう:ro を
    # 付けない。ホスト側の準備手順はHANDOFF.md T82参照。
    volumes: ["engine-data:/app/out", "../data:/app/data:ro", "../backup_ssh:/root/.ssh"]
    command: ["/bin/bash", "-c", "crontab /app/deploy/crontab && cron -f"]
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ashibase
      POSTGRES_USER: ashibase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORDを.envに設定してください}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashibase"]
      interval: 10s
      retries: 5
    restart: unless-stopped

volumes: { engine-data: {}, pgdata: {}, caddy-data: {}, caddy-config: {} }

networks:
  default: {}
  # stockfactory-officeのdeploy側（scripts/deploy.sh）が同名で事前作成する外部ネットワーク。
  # ここでは作成せず参加するだけ（external: true）——どちらのスクリプトを先に実行しても
  # 動くように、両スクリプトが「無ければ作る」を冪等に行う。
  stockfactory-shared:
    external: true
